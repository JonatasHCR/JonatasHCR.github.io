<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Jônatas Reis</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #fbfbf9; --ink: #1b1d22; --muted: #626772; --hash: #6d3fe6; --add: #1d8a4e; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #131417; --ink: #e9eaee; --muted: #9a9fab; --hash: #b69cff; --add: #5fd494; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 20px;
         background: var(--bg); color: var(--ink); font-family: "JetBrains Mono", Consolas, monospace; }
  main { display: grid; gap: 16px; max-width: 34em; }
  p { margin: 0; color: var(--muted); }
  p b { color: var(--add); font-weight: 500; }
  h1 { margin: 0; font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; font-size: clamp(40px, 8vw, 72px); line-height: 1; letter-spacing: -.03em; }
  h1 span { color: var(--hash); }
  a { color: var(--hash); }
</style>
</head>
<body>
<main>
  <p><b>$</b> git checkout pagina-que-voce-procurou</p>
  <p>error: pathspec did not match any file(s) known to git</p>
  <h1>404<span>.</span> Página não encontrada.</h1>
  <p><a href="/">← voltar para o portfólio</a></p>
</main>
</body>
</html>
